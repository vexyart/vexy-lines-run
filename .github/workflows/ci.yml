name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history to compute version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install Tk and Xvfb on Linux so the headless smoke test can run.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb python3-tk

      # Install the runtime deps from PyPI plus the test runner.
      # The conftest.py adds sibling src/ directories to sys.path when they
      # exist locally, but in CI we rely on PyPI packages instead.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            vexy-lines-py \
            vexy-lines-apy \
            customtkinter \
            "tkinterdnd2>=0.3.0" \
            "CTkMenuBarPlus>=0.1.3" \
            "Pillow>=10.0.0" \
            "show-in-file-manager>=1.1.4" \
            "loguru>=0.7.2" \
            "typing-extensions>=4.0" \
            "pyperclip>=1.8.0" \
            "opencv-python-headless>=4.8.0" \
            "av>=12.0.0" \
            pytest \
            pytest-cov

      - name: Install package (editable)
        run: pip install -e . --no-deps

      # Run the full test suite.  On Linux, wrap with xvfb-run so the headless
      # smoke test in test_smoke_headless.py can open a real Tk window instead
      # of skipping.
      - name: Run tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run python -m pytest tests/ -v --tb=short

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -v --tb=short
